name: Build

# WPF only builds on Windows, so CI is the place where the project is actually
# compiled and the tests are actually run. Runs on every push and can be started
# by hand.
# Only `push`: a pull_request trigger as well would run everything twice for
# every push to a PR branch in this repository.
on:
  push:
  workflow_dispatch:

# A newer push makes an in-flight run for the same branch pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CursorBubble.sln

      - name: Build (Release)
        run: dotnet build CursorBubble.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test CursorBubble.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Publish single-file exe
        run: >
          dotnet publish src/CursorBubble/CursorBubble.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -o publish

      - name: Upload CursorBubble.exe
        uses: actions/upload-artifact@v4
        with:
          name: CursorBubble
          path: publish/CursorBubble.exe
          if-no-files-found: error
