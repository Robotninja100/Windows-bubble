name: Build

# WPF only builds on Windows, so CI is the place where the project is actually
# compiled and the tests are actually run. Runs on every push and can be started
# by hand.
# Only `push`: a pull_request trigger as well would run everything twice for
# every push to a PR branch in this repository.
on:
  push:
  workflow_dispatch:

# A newer push makes an in-flight run for the same branch pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CursorBubble.sln

      # `dotnet list package --vulnerable` exits 0 whether or not it finds
      # anything, so the output has to be inspected to make this a gate rather
      # than a log line nobody reads.
      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list CursorBubble.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') {
            Write-Error "A referenced package has a known vulnerability (see above)."
            exit 1
          }
          Write-Host "No known vulnerabilities in the dependency graph."

      - name: Build (Release)
        run: dotnet build CursorBubble.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test CursorBubble.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # Line coverage, reported but not enforced. A threshold is only worth
      # setting once the number is known — the UI layer is untested, so a gate
      # picked today would encode that rather than improve on it.
      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          $report = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml |
                    Select-Object -First 1
          if (-not $report) {
            Write-Host "No coverage report was produced."
            exit 0
          }
          [xml]$xml = Get-Content $report.FullName
          $lines = [double]$xml.coverage.'line-rate' * 100
          $branches = [double]$xml.coverage.'branch-rate' * 100
          $text = "Line coverage: {0:N1}%  ·  Branch coverage: {1:N1}%" -f $lines, $branches
          Write-Host $text
          "### Coverage`n`n$text" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Publish single-file exe
        run: >
          dotnet publish src/CursorBubble/CursorBubble.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -o publish

      - name: Upload CursorBubble.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CursorBubble
          path: publish/CursorBubble.exe
          if-no-files-found: error
