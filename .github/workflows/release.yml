name: Release

# Tag a commit to publish a build:
#   git tag v1.2.0 && git push origin v1.2.0
#
# The version in the exe's file properties comes from the tag, so what a user
# has installed can always be traced back to a commit.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Read version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          # AssemblyVersion needs a plain numeric x.y.z; a pre-release suffix
          # (v1.2.0-beta1) only survives in the informational version.
          $numeric = ($version -split '-')[0]
          if ($numeric -notmatch '^\d+\.\d+(\.\d+)?$') {
            Write-Error "Tag '$tag' is not a version like v1.2.0"
            exit 1
          }
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          "full=$version"    >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore CursorBubble.sln

      - name: Build (Release)
        run: dotnet build CursorBubble.sln -c Release --no-restore

      - name: Test
        run: dotnet test CursorBubble.sln -c Release --no-build

      - name: Publish single-file exe
        run: >
          dotnet publish src/CursorBubble/CursorBubble.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.numeric }}
          -p:InformationalVersion=${{ steps.version.outputs.full }}
          -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/CursorBubble.exe -Algorithm SHA256).Hash
          "$hash  CursorBubble.exe" | Out-File -Encoding ascii publish/CursorBubble.exe.sha256
          Write-Host "SHA256: $hash"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: CursorBubble ${{ steps.version.outputs.full }}
          generate_release_notes: true
          draft: true
          files: |
            publish/CursorBubble.exe
            publish/CursorBubble.exe.sha256
          body: |
            Self-contained build — no .NET installation needed.

            The executable is **not code-signed**, so Windows SmartScreen will
            warn on first run: *More info* → *Run anyway*. Verify the download
            against `CursorBubble.exe.sha256` if you want to be sure it is the
            file this workflow built.
