name: Feature request
description: Something the app should be able to do and cannot.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, rather than the feature. It is often solvable a way
        neither of us has thought of yet.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional — if you already have a shape in mind, describe it.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Optional. A workaround that is merely annoying is useful to know about.
